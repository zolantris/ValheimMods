name: ValheimMods Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean
      environment:
        description: 'Environment to run tests against'
        type: environment
        required: true

jobs:
  build:
    name: ✅ Release Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.REPO_TOKEN }} # Ensure REPO_TOKEN has read access to the private submodule repo

      - name: Setup NuGet
        uses: nuget/setup-nuget@v1
        with:
          nuget-version: '5.x'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Restore NuGet Packages
        run: nuget restore ValheimMods.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      # Note: Windows workflows use PowerShell by default, where mkdir syntax changes slightly.
      - name: Create Build Directory
        run: New-Item -ItemType Directory -Force -Path _build

      - name: Build Main Solution
        run: |
          msbuild.exe ValheimMods.sln /nologo /nr:false /p:DeployOnBuild=true /p:DeployDefaultTarget=WebPublish /p:WebPublishMethod=FileSystem /p:DeleteExistingFiles=True /p:platform="Any CPU" /p:configuration="Release" /p:PublishUrl="../_build"

      # Combined step: 'dotnet run' will automatically build your standalone test project first
      - name: Run Convex Hull Tests
        run: |
          dotnet run --project tests/ConvexHull/ConvexHull.Tests.csproj --configuration Release -p:ManagedDataPath="${{ github.workspace }}\libs"